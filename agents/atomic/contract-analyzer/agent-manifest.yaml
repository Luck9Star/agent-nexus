name: contract-analyzer
version: 1.0.0
type: atomic
description: 合同条款分析专家，支持条款间依赖理解和风险识别

model_config:
  recommended: "premium"
  fallback: "standard"

capabilities: [clause-extraction, risk-analysis, compliance-checking]

mcp:
  tools: [extract_clauses, analyze_risks, check_compliance]

permissions:
  mode: default
  allowed_tools: [file_read, file_write, grep, glob]
  denied_tools: [bash]
