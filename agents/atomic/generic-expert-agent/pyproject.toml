[project]
name = "generic-expert-agent"
version = "0.1.0"
description = "Generic expert agent that loads Expert Profiles and produces structured artifacts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
full = [
    "fastmcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_generic_expert_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
