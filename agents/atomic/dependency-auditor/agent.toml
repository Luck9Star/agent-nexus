[agent]
name = "dependency-auditor"
version = "0.1.0"
type = "atomic"
description = "Dependency vulnerability scanner for Python projects"

[agent.model_config]
recommended = "standard"
fallback = "economy"
max_turns = 5

[agent.mcp]
tools = ["audit_dependencies"]

[agent.permissions]
mode = "default"
allowed_tools = ["file_read"]
