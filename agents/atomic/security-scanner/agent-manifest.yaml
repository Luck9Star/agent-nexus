name: security-scanner
version: 1.0.0
type: atomic
description: 应用安全扫描专家，集成实时漏洞数据库

model_config:
  recommended: "standard"
  fallback: "lightweight"

capabilities: [vulnerability-scanning, dependency-audit, security-reporting]

mcp:
  tools: [scan_code, check_dependencies, generate_report]

permissions:
  mode: default
  allowed_tools: [file_read, file_write, grep, glob]
  denied_tools: [bash]
