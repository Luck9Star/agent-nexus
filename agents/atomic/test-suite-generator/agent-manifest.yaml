name: test-suite-generator
version: 1.0.0
type: atomic
description: 测试套件生成专家，支持每范式测试策略

model_config:
  recommended: "standard"
  fallback: "lightweight"

capabilities: [code-analysis-for-tests, test-case-generation, suite-building]

mcp:
  tools: [analyze_code_for_tests, generate_test_cases, build_test_suite]

permissions:
  mode: default
  allowed_tools: [file_read, file_write, grep, glob]
  denied_tools: [bash]
