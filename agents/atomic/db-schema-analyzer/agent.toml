[agent]
name = "db-schema-analyzer"
version = "0.1.0"
type = "atomic"
description = "Database schema design reviewer and anti-pattern detector"

[agent.model_config]
recommended = "standard"
fallback = "economy"
max_turns = 5

[agent.mcp]
tools = ["review_schema"]

[agent.permissions]
mode = "default"
allowed_tools = ["file_read"]
