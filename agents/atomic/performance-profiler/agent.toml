[agent]
name = "performance-profiler"
version = "0.1.0"
type = "atomic"
description = "Performance bottleneck analysis agent"

[agent.model_config]
recommended = "standard"
fallback = "economy"
max_turns = 5

[agent.mcp]
tools = ["analyze_performance"]

[agent.permissions]
mode = "default"
allowed_tools = ["file_read"]
