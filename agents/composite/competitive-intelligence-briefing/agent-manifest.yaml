name: competitive-intelligence-briefing
version: 1.0.0
type: composite
description: 竞争情报简报生成流水线 — 从原始研究到精装简报，组合 Market Intel + Doc Filler + Localization

permissions:
  mode: default
  allowed_tools: [file_read, file_write, grep, glob]
  denied_tools: [bash]

model_config:
  recommended: "standard"
  fallback: "lightweight"

dependencies:
  atomic_agents:
    - market-intelligence-analyst
    - doc-filler
    - localization-specialist
