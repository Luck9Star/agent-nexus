name: document-compliance-gateway
version: 1.0.0
type: composite
description: 跨维度文档合规检测，集成法律、无障碍、本地化分析

permissions:
  mode: default
  allowed_tools: [file_read, file_write, grep, glob]
  denied_tools: [bash]

model_config:
  recommended: "standard"
  fallback: "lightweight"

dependencies:
  atomic_agents:
    - contract-analyzer
    - accessibility-auditor
    - localization-specialist
