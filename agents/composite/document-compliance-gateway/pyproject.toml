[project]
name = "agent-document-compliance-gateway"
version = "1.0.0"
description = "Cross-dimension document compliance checking with legal, accessibility, and localization analysis"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "toml>=0.10",
]

[project.optional-dependencies]
full = [
    "fastmcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_document_compliance_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
