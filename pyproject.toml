[project]
name = "agent-nexus"
version = "0.1.0"
description = "MCP-native Agent Platform with self-built orchestration"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.2",
    "fastmcp>=2.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "toml>=0.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "ipython>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
agent-nexus = "agent_nexus.platform.local.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
