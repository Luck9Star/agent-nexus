[workspace]
members = [
    "crates/ap-core",
    "crates/ap-runtime",
    "crates/ap-gateway",
    "crates/ap-fetcher",
    "crates/ap-evolution",
    "crates/ap-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }

# Git
git2 = "0.19"

# HTTP
axum = "0.8"

# System
libc = "0.2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
owo-colors = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
rstest = "0.22"
assert_cmd = "2"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
ap-core = { path = "crates/ap-core" }
ap-runtime = { path = "crates/ap-runtime" }
ap-gateway = { path = "crates/ap-gateway" }
ap-fetcher = { path = "crates/ap-fetcher" }
ap-evolution = { path = "crates/ap-evolution" }
